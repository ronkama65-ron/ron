<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f4f4f8;
    padding: 20px;
    min-height: 100vh;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
  }

  .note-form {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 24px;
  }

  input, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    margin-bottom: 12px;
    outline: none;
    resize: vertical;
  }

  input:focus, textarea:focus {
    border-color: #6c5ce7;
  }

  textarea { min-height: 100px; }

  button {
    background: #6c5ce7;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover { background: #5b4bc4; }

  .notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
  }

  .note {
    background: #fff9c4;
    padding: 16px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    min-height: 140px;
    position: relative;
  }

  .note h3 {
    color: #333;
    margin-bottom: 8px;
    word-wrap: break-word;
  }

  .note p {
    color: #555;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
    flex: 1;
  }

  .note .date {
    font-size: 11px;
    color: #999;
    margin-top: 10px;
  }

  .delete-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #ff6b6b;
    color: white;
    border: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .delete-btn:hover { background: #e05555; }

  .empty {
    text-align: center;
    color: #999;
    padding: 40px;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>📝 My Notes</h1>

    <div class="note-form">
      <input type="text" id="titleInput" placeholder="Note title..." maxlength="100">
      <textarea id="bodyInput" placeholder="Write your note here..."></textarea>
      <button onclick="addNote()">Add Note</button>
    </div>

    <div class="notes-grid" id="notesGrid"></div>
  </div>

<script>
  // Load notes from localStorage when page opens
  let notes = JSON.parse(localStorage.getItem('myNotes')) || [];

  function saveNotes() {
    localStorage.setItem('myNotes', JSON.stringify(notes));
  }

  function addNote() {
    const title = document.getElementById('titleInput').value.trim();
    const body = document.getElementById('bodyInput').value.trim();

    if (!title && !body) {
      alert('Please write something!');
      return;
    }

    notes.unshift({
      id: Date.now(),
      title: title || 'Untitled',
      body: body,
      date: new Date().toLocaleDateString()
    });

    saveNotes();
    renderNotes();

    document.getElementById('titleInput').value = '';
    document.getElementById('bodyInput').value = '';
  }

  function deleteNote(id) {
    notes = notes.filter(note => note.id !== id);
    saveNotes();
    renderNotes();
  }

  function renderNotes() {
    const grid = document.getElementById('notesGrid');

    if (notes.length === 0) {
      grid.innerHTML = '<div class="empty">No notes yet. Add one above!</div>';
      return;
    }

    grid.innerHTML = notes.map(note => `
      <div class="note">
        <button class="delete-btn" onclick="deleteNote(${note.id})" title="Delete">×</button>
        <h3>${escapeHtml(note.title)}</h3>
        <p>${escapeHtml(note.body)}</p>
        <div class="date">${note.date}</div>
      </div>
    `).join('');
  }

  // Prevents HTML injection
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Allow Ctrl+Enter to add note quickly
  document.getElementById('bodyInput').addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'Enter') addNote();
  });

  // Initial render
  renderNotes();
</script>
</body>
</html>
